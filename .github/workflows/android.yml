name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已预装 Android SDK（cmdline-tools）。
      # android-actions/setup-android 在部分 runner 上会因版本判定 + 许可证
      # 非交互接收失败而退出 1，这里改为手动接受许可证并安装所需组件。
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMDLINE" ]; then
            CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          fi
          echo "Using sdkmanager: $CMDLINE"
          yes | "$CMDLINE" --licenses > /dev/null 2>&1 || true
          "$CMDLINE" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wuji-reader-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
