plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wuji.reader'
    compileSdk 34

    defaultConfig {
        applicationId "com.wuji.reader"
        minSdk 23
        targetSdk 34
        versionCode 20
        versionName "0.20.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 🔴 关键：minSdk 23(Android 6) 没有 java.util.stream / java.util.function / java.time
        //（都是 API 24+）。jsoup 1.17.2 的 Element/Node/Elements/Collector 内部用了 Stream，
        // 不开这个开关会在 Android 6 上抛 NoClassDefFoundError 直接崩进程（模拟器是 Android 9+，不暴露）。
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 把 java.util.stream / function / Optional / java.time 的实现打包进 APK，
    // 让 API 24 以下设备也能跑（对应 compileOptions.coreLibraryDesugaringEnabled）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
